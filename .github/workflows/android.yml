
name: Qurilish SmartCall APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4      
       - name: Extract Android project
          run: |
            mkdir -p /tmp/smartcall
            unzip -o qurilish-smartcall-starter.zip -d /tmp/smartcall
            cp /tmp/smartcall/settings.gradle .
            cp /tmp/smartcall/build.gradle .
            cp -r /tmp/smartcall/app .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Qurilish-SmartCall-APK
          path: app/build/outputs/apk/debug/*.apk

